<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Kalkulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{min-height:100svh;display:flex;justify-content:center}.app{width:min(100%,430px);min-height:100svh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;flex-direction:column;justify-content:flex-end}
.display{height:150px;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px 4px 18px;font-size:clamp(48px,15vw,76px);font-weight:300;overflow:hidden;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:18px}
button{border:0;border-radius:50%;aspect-ratio:1;background:#333;color:#fff;font-size:28px;touch-action:manipulation}
button.fn{background:#a5a5a5;color:#000}.op{background:#ff9f0a}.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;text-align:left;padding-left:29px}
button:active{filter:brightness(1.3)}
</style>
</head>
<body>
<main class="app">
<div id="display" class="display" aria-live="polite">0</div>
<div class="keys">
<button class="fn" data-k="C">AC</button><button class="fn" data-k="back">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="/">÷</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
<button class="zero" data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="=">=</button>
</div>
</main>
<script>
(()=>{let e="",fresh=true;const d=document.getElementById("display");
function show(){d.textContent=e||"0"} function calc(){try{if(!/^[0-9+*/%().\- ]+$/.test(e))throw 0;let v=Function('"use strict";return('+e+')')();if(!Number.isFinite(v))throw 0;e=String(Number(v.toFixed(12)));fresh=true;show()}catch{d.textContent="Error";e="";setTimeout(show,700)}}
function p(k){if(k==="C"){e="";fresh=true;show();return}if(k==="back"){e=e.slice(0,-1);show();return}if(k==="%"){if(e)e=String(Number(e)/100);show();return}if(k==="="){calc();return}
if(fresh&&/[0-9.]/.test(k)){e="";fresh=false} if(/[+*/-]/.test(k)&&/[+*/-]$/.test(e))e=e.slice(0,-1);if(e.length<28)e+=k;show()}
document.querySelectorAll("button").forEach(b=>b.onclick=()=>p(b.dataset.k));
document.onkeydown=x=>{let k=x.key;if(/[0-9.+*/-]/.test(k))p(k);else if(k==="Enter")p("=");else if(k==="Backspace")p("back");else if(k==="Escape")p("C")};})();
</script>
</body>
</html>
